name: Super-Linter

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: super-linter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint changed files
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Without node_modules present, Super-Linter's TYPESCRIPT_ES step can't
      # resolve this repo's eslint.config.js (which imports typescript-eslint,
      # eslint-plugin-react-hooks, etc.), silently falls back to its own
      # bundled default ruleset (eslint-plugin-n), and then reports every
      # import in the repo as unresolvable and every browser API (localStorage,
      # navigator, crypto, Blob, URL) as an unsupported Node builtin.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      - name: Super-Linter
        uses: super-linter/super-linter@v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: false
          FILTER_REGEX_EXCLUDE: >-
            ^(dist|coverage|node_modules|playwright-report|test-results|supabase/.temp|supabase/functions/.*/node_modules)/
          VALIDATE_BASH: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_JSON: true
          VALIDATE_TYPESCRIPT_ES: true
          VALIDATE_YAML: true
