name: Super-Linter

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: super-linter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint changed files
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Without node_modules present, several Super-Linter validators (e.g.
      # TYPESCRIPT_ES) can't resolve this repo's dependencies.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      - name: Super-Linter
        uses: super-linter/super-linter@v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: false
          FILTER_REGEX_EXCLUDE: >-
            ^(dist|coverage|node_modules|playwright-report|test-results|supabase/.temp|supabase/functions/.*/node_modules)/
          VALIDATE_BASH: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_JSON: true
          # Disabled: Super-Linter's isolated TYPESCRIPT_ES run does not use
          # this repo's eslint.config.js (confirmed — it enforces rules like
          # @typescript-eslint/no-unused-vars that our config explicitly
          # turns off, and applies n/no-missing-import, a rule from
          # eslint-plugin-n that isn't in our config at all). It can't
          # resolve the @/* path aliases from tsconfig/vite.config.ts either
          # way, so every internal import is reported as unresolvable, and it
          # flags standard browser APIs (localStorage, navigator, crypto,
          # Blob, URL) as unsupported Node.js builtins since it lints this
          # browser-only frontend as if it were a Node target. All ~150
          # findings under this validator were confirmed false positives
          # against code that `npm run lint` (this repo's own ESLint config,
          # run with dependencies installed in ci.yml) already passes with 0
          # errors — that job is the authoritative TS/JS lint gate.
          VALIDATE_TYPESCRIPT_ES: false
          VALIDATE_YAML: true
