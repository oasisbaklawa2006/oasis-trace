version: 2.1

jobs:
  verify:
    docker:
      - image: cimg/node:22.16.0
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-npm-{{ checksum "package-lock.json" }}
            - v1-npm-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: v1-npm-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Repository boundaries
          command: npm run check:boundaries
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Typecheck
          command: npm run typecheck
      - run:
          name: Unit tests
          command: npm test
      - run:
          name: Production build
          command: npm run build

workflows:
  circleci-verification:
    jobs:
      - verify
